[package]
name = "stickies"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
gdk4 = "0.11.5"
gio = "0.22.10"
glib = "0.22.10"
gtk4 = { version = "0.11.5", features = ["v4_18"] }
libadwaita = { version = "0.9.2", features = ["v1_6"] }
mime_guess = "2.0.5"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sourceview5 = { version = "0.11.2", features = ["v5_18"] }
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.0", features = ["v7", "serde"] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
strip = true
